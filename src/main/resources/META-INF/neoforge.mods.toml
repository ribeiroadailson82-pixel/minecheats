modLoader="javafml"
loaderVersion="[4,)"
license="For private/LAN use only"
issueTrackerURL="https://github.com/ribeiroadailson82-pixel/minecheats/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="MineCheats"
description='''
Client-side utility/cheat mod for Minecraft ${minecraft_version} (NeoForge).
For use on your own LAN / private survival servers.
Open the ClickGUI with RIGHT SHIFT and toggle modules.
'''

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.11,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.11,1.22)"
    ordering="NONE"
    side="CLIENT"
